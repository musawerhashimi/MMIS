# Serves the built frontend and forwards everything else to the API.
#
# One origin for the browser, so there is no CORS to configure and the
# websocket connection needs no special handling on the client.

upstream api {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Student work is often large; the application enforces its own limit
    # and this must not refuse the upload before it gets there.
    client_max_body_size 60M;

    # Slow connections are the norm, so give an upload time to finish.
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 1024;

    # --- The application ------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # A single-page app: unknown paths are routes, not missing files.
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets never change, so let the browser keep them.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must not be cached, or a deployment would not reach anyone.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # --- The API ---------------------------------------------------------
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location /admin/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://api;
        expires 1y;
        add_header Cache-Control "public";
    }

    # --- Live updates ----------------------------------------------------
    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A dashboard left open all day must not be disconnected hourly.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Uploaded documents are never served from here. They go through a
    # permission-checked view under /api/, because a monograph draft is
    # private to the people working on it.

    # --- Safety headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
}
