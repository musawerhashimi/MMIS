# The whole system on one machine inside the university.
#
# Everything here runs locally: no internet connection is needed once the
# images are built, because the department must keep working when the link
# is down. Only power is required.
#
#   docker compose up -d --build
#   docker compose exec backend python manage.py migrate
#   docker compose exec backend python manage.py createsuperuser

name: monograph

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-monograph}
      POSTGRES_USER: ${POSTGRES_USER:-monograph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monograph}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published: only the other containers need to reach the database.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      # Student work and backups outlive the container.
      - media:/app/media
      - private_media:/app/private_media
      - static:/app/staticfiles
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs the nightly deadline checks, the inactivity warnings and the backups.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media:/app/media
      - private_media:/app/private_media
      - backups:/app/backups
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # Triggers those jobs on schedule.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  media:
  private_media:
  static:
  backups:
